<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <title>🛍️ShortShop - Ana's Virtual Shop&copy;</title>
</head>
<body>
    <header>
        <div class="logo">
           🛍️ShortShop
        </div>

        <div class="header-info">
            <span>My Virtual Shop</span>
            <span>🛒<strong id="contador-carrinho">0</strong></span>
        </div>
    </header>

    <main class="container">
        <section class="loja">
            <div>
            <h1>Our Products:</h1>
            <p>Choose your favorite products!</p>
            </div>
            <div id="lista-produtos" class="grid-produtos">
            </div>
        </section>

        <aside class="carrinho">
            <h2>🛒 Your Shopping Cart:</h2>
            <div id="lista-carrinho"></div>
            <div class="resumo-carrinho">
                <div class="linha-total">
                    <span>Total:</span>
                    <strong id="total-carrinho"> US$ 0,00</strong>
                </div>
                <button id="btn-finalizar" class="btn-finalizar" onclick="finalizarCompra()">Complete Purchase</button>
            </div>
        </aside>
    </main>
</body>
</html>
